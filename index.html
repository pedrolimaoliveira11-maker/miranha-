<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>UFC 3D - MMA Fight (Corrigido)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#0a0a12; font-family:'Segoe UI', Arial, sans-serif; user-select:none; }
  #ui {
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:20;
  }
  .health-container {
    position:absolute; top:25px; width:36%;
  }
  #playerHealthBox { left:3%; }
  #enemyHealthBox  { right:3%; }
  .health-bar {
    height:26px; background:rgba(0,0,0,0.75);
    border:3px solid #fff; border-radius:8px; overflow:hidden;
    box-shadow:0 0 12px rgba(0,0,0,0.6);
  }
  .health-fill {
    height:100%; transition:width 0.25s ease;
  }
  #playerFill { background:linear-gradient(90deg,#00e676,#69f0ae); width:100%; }
  #enemyFill  { background:linear-gradient(90deg,#ff1744,#ff5252); width:100%; float:right; }
  .health-text {
    position:absolute; top:0; width:100%; height:26px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:bold; font-size:15px;
    text-shadow:0 1px 3px #000; pointer-events:none;
  }
  .name {
    margin-top:6px; color:#fff; font-size:16px; font-weight:bold;
    text-shadow:0 2px 4px #000;
  }
  #playerName { text-align:left; }
  #enemyName  { text-align:right; }
  #round {
    position:absolute; top:18px; left:50%; transform:translateX(-50%);
    color:#ffd700; font-size:26px; font-weight:900;
    text-shadow:0 0 12px #000, 0 0 20px #ffd700;
    letter-spacing:2px;
  }
  #message {
    position:absolute; top:48%; left:50%; transform:translate(-50%,-50%);
    color:#fff; font-size:52px; font-weight:900; text-align:center;
    text-shadow:0 0 25px #000; opacity:0; transition:opacity 0.35s;
    pointer-events:none; letter-spacing:3px;
  }
  #ko {
    position:absolute; top:38%; left:50%; transform:translate(-50%,-50%);
    font-size:100px; color:#ff1744; font-weight:900;
    text-shadow:0 0 40px #000; opacity:0; transition:opacity 0.5s;
    letter-spacing:12px; pointer-events:none;
  }
  #controls {
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    color:#bbb; font-size:13px; text-align:center;
    background:rgba(0,0,0,0.55); padding:8px 22px; border-radius:25px;
    border:1px solid rgba(255,255,255,0.15);
  }
  #fps {
    position:absolute; bottom:18px; right:18px;
    color:#666; font-size:12px;
  }
</style>
</head>
<body>
<div id="ui">
  <div class="health-container" id="playerHealthBox">
    <div class="health-bar">
      <div class="health-fill" id="playerFill"></div>
      <div class="health-text" id="playerHpText">100%</div>
    </div>
    <div class="name" id="playerName">VOCÊ</div>
  </div>
  <div class="health-container" id="enemyHealthBox">
    <div class="health-bar">
      <div class="health-fill" id="enemyFill"></div>
      <div class="health-text" id="enemyHpText">100%</div>
    </div>
    <div class="name" id="enemyName">ADVERSÁRIO</div>
  </div>
  <div id="round">ROUND 1</div>
  <div id="message"></div>
  <div id="ko">K.O.</div>
  <div id="controls">A / D ←→ mover &nbsp;|&nbsp; W / S ↑↓ avançar/recuar &nbsp;|&nbsp; ESPAÇO soco &nbsp;|&nbsp; SHIFT bloquear</div>
  <div id="fps"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===================== SETUP =====================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a18, 0.018);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 120);
camera.position.set(0, 5.2, 14);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:"high-performance" });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// ===================== FUNDO FALSO ANIMADO =====================
// Céu / estádio distante
const bgGeo = new THREE.SphereGeometry(80, 32, 16);
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 1024; bgCanvas.height = 512;
const bgCtx = bgCanvas.getContext('2d');

function drawBackground(offset){
  const g = bgCtx.createLinearGradient(0,0,0,512);
  g.addColorStop(0, '#0a0a22');
  g.addColorStop(0.4, '#12122e');
  g.addColorStop(0.7, '#1a1a3a');
  g.addColorStop(1, '#0d0d18');
  bgCtx.fillStyle = g;
  bgCtx.fillRect(0,0,1024,512);

  // Estrelas / luzes distantes
  bgCtx.fillStyle = '#ffffff';
  for(let i=0;i<80;i++){
    const x = (i*137 + offset*30) % 1024;
    const y = 40 + (i*89)%180;
    const s = 0.8 + (i%3)*0.6;
    bgCtx.globalAlpha = 0.3 + (i%5)*0.12;
    bgCtx.beginPath();
    bgCtx.arc(x, y, s, 0, Math.PI*2);
    bgCtx.fill();
  }
  bgCtx.globalAlpha = 1;

  // Arquibancadas simuladas (linhas horizontais com movimento)
  bgCtx.strokeStyle = 'rgba(80,80,120,0.35)';
  bgCtx.lineWidth = 2;
  for(let y=280; y<480; y+=18){
    bgCtx.beginPath();
    bgCtx.moveTo(0, y);
    bgCtx.lineTo(1024, y);
    bgCtx.stroke();
  }

  // Luzes de estádio (círculos brilhantes)
  const lights = [
    {x:200, y:120}, {x:512, y:90}, {x:820, y:120},
    {x:320, y:160}, {x:700, y:160}
  ];
  lights.forEach((l,i)=>{
    const pulse = 0.6 + Math.sin(offset*2 + i)*0.25;
    const grd = bgCtx.createRadialGradient(l.x, l.y, 0, l.x, l.y, 40);
    grd.addColorStop(0, `rgba(255,240,180,${0.5*pulse})`);
    grd.addColorStop(0.4, `rgba(255,200,100,${0.2*pulse})`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    bgCtx.fillStyle = grd;
    bgCtx.beginPath();
    bgCtx.arc(l.x, l.y, 45, 0, Math.PI*2);
    bgCtx.fill();
  });
}

const bgTex = new THREE.CanvasTexture(bgCanvas);
bgTex.encoding = THREE.sRGBEncoding;
const bgMat = new THREE.MeshBasicMaterial({ map:bgTex, side:THREE.BackSide });
const bgMesh = new THREE.Mesh(bgGeo, bgMat);
scene.add(bgMesh);

// ===================== ILUMINAÇÃO =====================
const ambient = new THREE.AmbientLight(0x334466, 0.55);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0x6688cc, 0x221133, 0.45);
scene.add(hemi);

const spotMain = new THREE.SpotLight(0xffffff, 1.4, 50, Math.PI/3.5, 0.35, 1);
spotMain.position.set(0, 18, 6);
spotMain.castShadow = true;
spotMain.shadow.mapSize.set(2048,2048);
spotMain.shadow.bias = -0.0001;
scene.add(spotMain);
scene.add(spotMain.target);

const spotLeft = new THREE.SpotLight(0xffcc88, 0.7, 40, Math.PI/4, 0.4);
spotLeft.position.set(-10, 14, -4);
spotLeft.castShadow = true;
scene.add(spotLeft);

const spotRight = new THREE.SpotLight(0x88aaff, 0.6, 40, Math.PI/4, 0.4);
spotRight.position.set(10, 14, -4);
scene.add(spotRight);

// ===================== RINGUE / OCTÓGONO =====================
const ringGroup = new THREE.Group();

// Piso do ringue
const floorGeo = new THREE.CircleGeometry(11.5, 64);
const floorMat = new THREE.MeshStandardMaterial({
  color:0x1a1a1a, roughness:0.65, metalness:0.15
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
ringGroup.add(floor);

// Logo UFC no chão
const logoCanvas = document.createElement('canvas');
logoCanvas.width = 512; logoCanvas.height = 512;
const lctx = logoCanvas.getContext('2d');
lctx.fillStyle = '#111';
lctx.fillRect(0,0,512,512);
lctx.strokeStyle = '#ffd700';
lctx.lineWidth = 16;
lctx.beginPath();
for(let i=0;i<8;i++){
  const a = (i/8)*Math.PI*2 - Math.PI/8;
  const x = 256 + Math.cos(a)*195;
  const y = 256 + Math.sin(a)*195;
  i===0 ? lctx.moveTo(x,y) : lctx.lineTo(x,y);
}
lctx.closePath(); lctx.stroke();
lctx.fillStyle = '#ffd700';
lctx.font = 'bold 92px Arial';
lctx.textAlign = 'center';
lctx.textBaseline = 'middle';
lctx.fillText('UFC', 256, 256);
const logoTex = new THREE.CanvasTexture(logoCanvas);
const logo = new THREE.Mesh(
  new THREE.CircleGeometry(3.8, 48),
  new THREE.MeshBasicMaterial({ map:logoTex, transparent:true, opacity:0.9 })
);
logo.rotation.x = -Math.PI/2;
logo.position.y = 0.015;
ringGroup.add(logo);

// Grade / cerca do octógono
const fenceMat = new THREE.MeshStandardMaterial({
  color:0x2a2a2a, metalness:0.75, roughness:0.25, transparent:true, opacity:0.9
});
const postMat = new THREE.MeshStandardMaterial({
  color:0x444444, metalness:0.8, roughness:0.2
});

for(let i=0; i<8; i++){
  const angle = (i/8) * Math.PI * 2;
  const nextAngle = ((i+1)/8) * Math.PI * 2;

  // Postes
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,3.4,10), postMat);
  post.position.set(Math.cos(angle)*11.2, 1.7, Math.sin(angle)*11.2);
  post.castShadow = true;
  ringGroup.add(post);

  // Painéis da grade
  const midAngle = (angle + nextAngle)/2;
  const panel = new THREE.Mesh(new THREE.BoxGeometry(8.6, 2.9, 0.07), fenceMat);
  panel.position.set(Math.cos(midAngle)*10.95, 1.55, Math.sin(midAngle)*10.95);
  panel.rotation.y = -midAngle;
  panel.castShadow = true;
  ringGroup.add(panel);

  // Topo da cerca
  const topRail = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.12, 0.12), postMat);
  topRail.position.set(Math.cos(midAngle)*10.95, 3.05, Math.sin(midAngle)*10.95);
  topRail.rotation.y = -midAngle;
  ringGroup.add(topRail);
}

// Base elevada do ringue
const base = new THREE.Mesh(
  new THREE.CylinderGeometry(12.2, 12.5, 0.4, 64),
  new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.8 })
);
base.position.y = -0.2;
base.receiveShadow = true;
ringGroup.add(base);

scene.add(ringGroup);

// ===================== LUTADORES =====================
function createFighter(bodyColor, skinColor){
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color:bodyColor, roughness:0.55, metalness:0.08 });
  const skinMat = new THREE.MeshStandardMaterial({ color:skinColor, roughness:0.7 });
  const gloveMat = new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.35, metalness:0.2 });

  // Tronco
  const torso = new THREE.Mesh(new THREE.BoxGeometry(1.05, 1.35, 0.5), bodyMat);
  torso.position.y = 1.55;
  torso.castShadow = true;
  g.add(torso);

  // Cabeça
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.36, 16, 16), skinMat);
  head.position.y = 2.48;
  head.castShadow = true;
  g.add(head);

  // Braços
  const armGeo = new THREE.BoxGeometry(0.26, 0.85, 0.26);
  const leftArm = new THREE.Mesh(armGeo, skinMat);
  leftArm.position.set(-0.72, 1.65, 0);
  leftArm.castShadow = true;
  g.add(leftArm);

  const rightArm = new THREE.Mesh(armGeo, skinMat);
  rightArm.position.set(0.72, 1.65, 0);
  rightArm.castShadow = true;
  g.add(rightArm);

  // Antebraços
  const foreGeo = new THREE.BoxGeometry(0.23, 0.65, 0.23);
  const leftFore = new THREE.Mesh(foreGeo, skinMat);
  leftFore.position.set(-0.72, 1.05, 0);
  leftFore.castShadow = true;
  g.add(leftFore);

  const rightFore = new THREE.Mesh(foreGeo, skinMat);
  rightFore.position.set(0.72, 1.05, 0);
  rightFore.castShadow = true;
  g.add(rightFore);

  // Luvas
  const gloveGeo = new THREE.SphereGeometry(0.2, 12, 12);
  const leftGlove = new THREE.Mesh(gloveGeo, gloveMat);
  leftGlove.position.set(-0.72, 0.7, 0);
  leftGlove.castShadow = true;
  g.add(leftGlove);

  const rightGlove = new THREE.Mesh(gloveGeo, gloveMat);
  rightGlove.position.set(0.72, 0.7, 0);
  rightGlove.castShadow = true;
  g.add(rightGlove);

  // Pernas
  const legGeo = new THREE.BoxGeometry(0.32, 1.05, 0.32);
  const leftLeg = new THREE.Mesh(legGeo, bodyMat);
  leftLeg.position.set(-0.28, 0.52, 0);
  leftLeg.castShadow = true;
  g.add(leftLeg);

  const rightLeg = new THREE.Mesh(legGeo, bodyMat);
  rightLeg.position.set(0.28, 0.52, 0);
  rightLeg.castShadow = true;
  g.add(rightLeg);

  g.userData = {
    leftArm, rightArm, leftFore, rightFore, leftGlove, rightGlove,
    head, torso, leftLeg, rightLeg,
    punching:false, punchSide:'right', punchProgress:0,
    blocking:false, health:100, knocked:false,
    velocity: new THREE.Vector3(),
    orig: {
      leftArm: leftArm.position.clone(),
      rightArm: rightArm.position.clone(),
      leftFore: leftFore.position.clone(),
      rightFore: rightFore.position.clone(),
      leftGlove: leftGlove.position.clone(),
      rightGlove: rightGlove.position.clone()
    }
  };
  return g;
}

const player = createFighter(0x1565c0, 0xffcc99);
player.position.set(-3.8, 0, 0);
player.rotation.y = Math.PI/2;
scene.add(player);

const enemy = createFighter(0xc62828, 0xd4a574);
enemy.position.set(3.8, 0, 0);
enemy.rotation.y = -Math.PI/2;
scene.add(enemy);

// ===================== CONTROLES =====================
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if(e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);

let gameOver = false;
let messageTimer = 0;

function showMessage(txt, dur=1.4){
  const el = document.getElementById('message');
  el.textContent = txt;
  el.style.opacity = 1;
  messageTimer = dur;
}

// ===================== COMBATE =====================
function punch(f){
  if(f.userData.punching || f.userData.blocking || f.userData.knocked) return;
  f.userData.punching = true;
  f.userData.punchProgress = 0;
  f.userData.punchSide = Math.random() > 0.45 ? 'right' : 'left';
}

function checkHit(attacker, defender){
  const dist = attacker.position.distanceTo(defender.position);
  if(dist > 2.9) return false;

  const dir = new THREE.Vector3().subVectors(defender.position, attacker.position).normalize();
  const facing = new THREE.Vector3(0,0,1).applyQuaternion(attacker.quaternion);
  if(facing.dot(dir) < 0.25) return false;

  if(defender.userData.blocking){
    defender.userData.health = Math.max(0, defender.userData.health - 2.5);
    showMessage('BLOQUEADO!', 0.5);
    createImpact(defender.position.clone().add(new THREE.Vector3(0,1.7,0)), 0x88aaff);
    return true;
  }

  const dmg = 7 + Math.random()*8;
  defender.userData.health = Math.max(0, defender.userData.health - dmg);
  defender.userData.velocity.add(dir.multiplyScalar(0.42));

  createImpact(defender.position.clone().add(new THREE.Vector3(0,1.75,0)), 0xffaa00);

  if(defender.userData.health <= 0){
    defender.userData.health = 0;
    defender.userData.knocked = true;
    gameOver = true;
    document.getElementById('ko').style.opacity = 1;
    showMessage(attacker === player ? 'VOCÊ VENCEU!' : 'VOCÊ PERDEU!', 6);
  }
  return true;
}

// Partículas
const particles = [];
function createImpact(pos, color){
  for(let i=0;i<14;i++){
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.05+Math.random()*0.04, 6, 6),
      new THREE.MeshBasicMaterial({ color, transparent:true })
    );
    p.position.copy(pos);
    p.userData.vel = new THREE.Vector3(
      (Math.random()-0.5)*0.35,
      Math.random()*0.28,
      (Math.random()-0.5)*0.35
    );
    p.userData.life = 0.55 + Math.random()*0.2;
    scene.add(p);
    particles.push(p);
  }
}

// ===================== IA =====================
let enemyCooldown = 1.2;
function updateAI(dt){
  if(enemy.userData.knocked || gameOver) return;

  const dist = player.position.distanceTo(enemy.position);
  const dir = new THREE.Vector3().subVectors(player.position, enemy.position).normalize();

  // Sempre olha para o jogador
  const targetRot = Math.atan2(dir.x, dir.z);
  enemy.rotation.y = THREE.MathUtils.lerp(enemy.rotation.y, targetRot, 0.12);

  enemyCooldown -= dt;

  if(dist > 3.1){
    enemy.position.add(dir.clone().multiplyScalar(2.4 * dt));
  } else if(dist < 1.9){
    enemy.position.add(dir.clone().multiplyScalar(-1.8 * dt));
  }

  if(enemyCooldown <= 0 && dist < 3.2){
    if(Math.random() < 0.68){
      punch(enemy);
    } else {
