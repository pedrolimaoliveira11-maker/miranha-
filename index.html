<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>UFC 3D - MMA Fight</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#111; font-family: 'Segoe UI', Arial, sans-serif; }
  #ui {
    position:absolute; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:10;
  }
  .health-bar {
    position:absolute; top:30px; width:38%; height:28px;
    background:rgba(0,0,0,0.7); border:3px solid #fff;
    border-radius:6px; overflow:hidden;
  }
  #playerHealth { left:4%; }
  #enemyHealth  { right:4%; }
  .health-fill {
    height:100%; transition: width 0.3s ease;
  }
  #playerFill { background: linear-gradient(90deg,#00c853,#76ff03); width:100%; }
  #enemyFill  { background: linear-gradient(90deg,#ff1744,#ff5252); width:100%; float:right; }
  .name {
    position:absolute; top:62px; color:#fff; font-size:18px; font-weight:bold;
    text-shadow:0 2px 4px #000;
  }
  #playerName { left:4%; }
  #enemyName  { right:4%; text-align:right; }
  #round {
    position:absolute; top:20px; left:50%; transform:translateX(-50%);
    color:#ffd700; font-size:28px; font-weight:bold; text-shadow:0 0 10px #000;
  }
  #message {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#fff; font-size:48px; font-weight:bold; text-align:center;
    text-shadow:0 0 20px #000; opacity:0; transition:opacity 0.4s;
    pointer-events:none;
  }
  #controls {
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    color:#aaa; font-size:14px; text-align:center; background:rgba(0,0,0,0.5);
    padding:8px 20px; border-radius:20px;
  }
  #ko {
    position:absolute; top:40%; left:50%; transform:translate(-50%,-50%);
    font-size:90px; color:#ff1744; font-weight:900; text-shadow:0 0 30px #000;
    opacity:0; transition:opacity 0.5s; letter-spacing:8px;
  }
</style>
</head>
<body>
<div id="ui">
  <div class="health-bar" id="playerHealth"><div class="health-fill" id="playerFill"></div></div>
  <div class="health-bar" id="enemyHealth"><div class="health-fill" id="enemyFill"></div></div>
  <div class="name" id="playerName">VOCÊ</div>
  <div class="name" id="enemyName">ADVERSÁRIO</div>
  <div id="round">ROUND 1</div>
  <div id="message"></div>
  <div id="ko">K.O.</div>
  <div id="controls">A/D ou ←→ mover | W/S avançar/recuar | ESPAÇO soco | SHIFT bloquear</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ==================== CONFIGURAÇÃO ====================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 20, 60);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 4.5, 12);
camera.lookAt(0, 1.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Luzes
const ambient = new THREE.AmbientLight(0x404060, 0.6);
scene.add(ambient);

const spot1 = new THREE.SpotLight(0xffffff, 1.2, 40, Math.PI/4, 0.4);
spot1.position.set(8, 15, 8);
spot1.castShadow = true;
spot1.shadow.mapSize.set(2048,2048);
scene.add(spot1);

const spot2 = new THREE.SpotLight(0xffaa88, 0.8, 40, Math.PI/4, 0.4);
spot2.position.set(-8, 12, -5);
spot2.castShadow = true;
scene.add(spot2);

const hemi = new THREE.HemisphereLight(0x87ceeb, 0x444444, 0.4);
scene.add(hemi);

// ==================== ARENA ====================
const floorGeo = new THREE.CircleGeometry(12, 64);
const floorMat = new THREE.MeshStandardMaterial({ 
  color:0x222222, roughness:0.6, metalness:0.1 
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

// Octógono
const octagon = new THREE.Group();
const fenceMat = new THREE.MeshStandardMaterial({ color:0x333333, metalness:0.7, roughness:0.3, transparent:true, opacity:0.85 });
for(let i=0; i<8; i++){
  const angle = (i/8)*Math.PI*2;
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,3.2,8), fenceMat);
  post.position.set(Math.cos(angle)*11.5, 1.6, Math.sin(angle)*11.5);
  post.castShadow = true;
  octagon.add(post);
  
  const panel = new THREE.Mesh(new THREE.BoxGeometry(8.5, 2.8, 0.08), fenceMat);
  panel.position.set(Math.cos(angle+Math.PI/8)*11.2, 1.5, Math.sin(angle+Math.PI/8)*11.2);
  panel.rotation.y = -angle - Math.PI/8;
  panel.castShadow = true;
  octagon.add(panel);
}
scene.add(octagon);

// Canvas logo no chão
const canvas = document.createElement('canvas');
canvas.width = 512; canvas.height = 512;
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#111';
ctx.fillRect(0,0,512,512);
ctx.strokeStyle = '#ffd700';
ctx.lineWidth = 18;
ctx.beginPath();
for(let i=0;i<8;i++){
  const a = (i/8)*Math.PI*2 - Math.PI/8;
  const x = 256 + Math.cos(a)*200;
  const y = 256 + Math.sin(a)*200;
  if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
}
ctx.closePath(); ctx.stroke();
ctx.fillStyle = '#ffd700';
ctx.font = 'bold 90px Arial';
ctx.textAlign = 'center';
ctx.fillText('UFC', 256, 280);
const logoTex = new THREE.CanvasTexture(canvas);
const logo = new THREE.Mesh(new THREE.CircleGeometry(4,32), new THREE.MeshBasicMaterial({map:logoTex, transparent:true}));
logo.rotation.x = -Math.PI/2;
logo.position.y = 0.02;
scene.add(logo);

// ==================== LUTADORES ====================
function createFighter(color, skinColor){
  const group = new THREE.Group();
  
  // Corpo
  const bodyMat = new THREE.MeshStandardMaterial({ color:color, roughness:0.5, metalness:0.1 });
  const skinMat = new THREE.MeshStandardMaterial({ color:skinColor, roughness:0.7 });
  
  // Tronco
  const torso = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.4, 0.55), bodyMat);
  torso.position.y = 1.6;
  torso.castShadow = true;
  group.add(torso);
  
  // Cabeça
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 16), skinMat);
  head.position.y = 2.55;
  head.castShadow = true;
  group.add(head);
  
  // Braços
  const armGeo = new THREE.BoxGeometry(0.28, 0.9, 0.28);
  const leftArm = new THREE.Mesh(armGeo, skinMat);
  leftArm.position.set(-0.75, 1.7, 0);
  leftArm.castShadow = true;
  group.add(leftArm);
  
  const rightArm = new THREE.Mesh(armGeo, skinMat);
  rightArm.position.set(0.75, 1.7, 0);
  rightArm.castShadow = true;
  group.add(rightArm);
  
  // Antebraços (para animação de soco)
  const forearmGeo = new THREE.BoxGeometry(0.25, 0.7, 0.25);
  const leftFore = new THREE.Mesh(forearmGeo, skinMat);
  leftFore.position.set(-0.75, 1.1, 0);
  leftFore.castShadow = true;
  group.add(leftFore);
  
  const rightFore = new THREE.Mesh(forearmGeo, skinMat);
  rightFore.position.set(0.75, 1.1, 0);
  rightFore.castShadow = true;
  group.add(rightFore);
  
  // Pernas
  const legGeo = new THREE.BoxGeometry(0.35, 1.1, 0.35);
  const leftLeg = new THREE.Mesh(legGeo, bodyMat);
  leftLeg.position.set(-0.3, 0.55, 0);
  leftLeg.castShadow = true;
  group.add(leftLeg);
  
  const rightLeg = new THREE.Mesh(legGeo, bodyMat);
  rightLeg.position.set(0.3, 0.55, 0);
  rightLeg.castShadow = true;
  group.add(rightLeg);
  
  // Luvas
  const gloveGeo = new THREE.SphereGeometry(0.22, 12, 12);
  const gloveMat = new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.4 });
  const leftGlove = new THREE.Mesh(gloveGeo, gloveMat);
  leftGlove.position.set(-0.75, 0.75, 0);
  leftGlove.castShadow = true;
  group.add(leftGlove);
  
  const rightGlove = new THREE.Mesh(gloveGeo, gloveMat);
  rightGlove.position.set(0.75, 0.75, 0);
  rightGlove.castShadow = true;
  group.add(rightGlove);
  
  // Guardar referências para animação
  group.userData = {
    leftArm, rightArm, leftFore, rightFore, leftGlove, rightGlove,
    head, torso, leftLeg, rightLeg,
    punching: false, punchSide: 'right', punchProgress: 0,
    blocking: false, health: 100, knocked: false,
    velocity: new THREE.Vector3(),
    originalPositions: {
      leftArm: leftArm.position.clone(),
      rightArm: rightArm.position.clone(),
      leftFore: leftFore.position.clone(),
      rightFore: rightFore.position.clone(),
      leftGlove: leftGlove.position.clone(),
      rightGlove: rightGlove.position.clone()
    }
  };
  
  return group;
}

const player = createFighter(0x1e88e5, 0xffcc99);
player.position.set(-3.5, 0, 0);
player.rotation.y = Math.PI/2;
scene.add(player);

const enemy = createFighter(0xe53935, 0xd4a574);
enemy.position.set(3.5, 0, 0);
enemy.rotation.y = -Math.PI/2;
scene.add(enemy);

// ==================== CONTROLES ====================
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; if(e.code==='Space') e.preventDefault(); });
window.addEventListener('keyup',   e => { keys[e.code] = false; });

let gameOver = false;
let messageTimer = 0;

function showMessage(txt, duration=1.5){
  const el = document.getElementById('message');
  el.textContent = txt;
  el.style.opacity = 1;
  messageTimer = duration;
}

// ==================== LÓGICA DE COMBATE ====================
function punch(fighter, isPlayer){
  if(fighter.userData.punching || fighter.userData.blocking || fighter.userData.knocked) return;
  fighter.userData.punching = true;
  fighter.userData.punchProgress = 0;
  fighter.userData.punchSide = Math.random()>0.5 ? 'right' : 'left';
}

function checkHit(attacker, defender){
  const dist = attacker.position.distanceTo(defender.position);
  if(dist > 2.8) return false;
  
  // Direção do soco
  const dir = new THREE.Vector3().subVectors(defender.position, attacker.position).normalize();
  const facing = new THREE.Vector3(0,0,1).applyQuaternion(attacker.quaternion);
  if(facing.dot(dir) < 0.3) return false; // não está olhando
  
  if(defender.userData.blocking){
    // Bloqueio parcial
    defender.userData.health -= 3;
    showMessage('BLOQUEADO!', 0.6);
    return true;
  }
  
  // Acerto
  const damage = 8 + Math.random()*7;
  defender.userData.health -= damage;
  defender.userData.velocity.add(dir.multiplyScalar(0.35));
  
  // Efeito visual de impacto
  createImpact(defender.position.clone().add(new THREE.Vector3(0,1.8,0)));
  
  if(defender.userData.health <= 0){
    defender.userData.health = 0;
    defender.userData.knocked = true;
    gameOver = true;
    document.getElementById('ko').style.opacity = 1;
    showMessage(attacker === player ? 'VOCÊ VENCEU!' : 'VOCÊ PERDEU!', 5);
  }
  return true;
}

// Partículas de impacto
const particles = [];
function createImpact(pos){
  for(let i=0;i<12;i++){
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.06,6,6),
      new THREE.MeshBasicMaterial({ color:0xffaa00 })
    );
    p.position.copy(pos);
    p.userData.vel = new THREE.Vector3(
      (Math.random()-0.5)*0.3,
      Math.random()*0.25,
      (Math.random()-0.5)*0.3
    );
    p.userData.life = 0.6;
    scene.add(p);
    particles.push(p);
  }
}

// ==================== IA DO ADVERSÁRIO ====================
let enemyTimer = 0;
function updateAI(dt){
  if(enemy.userData.knocked || gameOver) return;
  
  const dist = player.position.distanceTo(enemy.position);
  const dir = new THREE.Vector3().subVectors(player.position, enemy.position).normalize();
  
  // Sempre olha para o jogador
  enemy.rotation.y = Math.atan2(dir.x, dir.z);
  
  enemyTimer -= dt;
